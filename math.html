<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>116 國中數學第一冊（一至三章）會考模擬特訓網頁</title>
    <!-- 引入 Tailwind CSS 打造現代化美觀介面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 MathJax 讓數學公式、根號、指數、分數完美呈現 -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 頂部導覽列 -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md py-6 px-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">116 國中數學(一)會考非選與歷屆特訓</h1>
                <p class="text-blue-100 text-sm mt-1">分章隨機檢測系統 • 每回隨機抽測：15 題選擇 ＋ 5 題非選</p>
            </div>
            <span class="bg-white/20 text-white px-3 py-1 rounded-full text-xs font-semibold">116 專業無重置超大題庫隨機版</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto my-8 px-4">
        <!-- 步驟一：選擇章節畫面 -->
        <div id="setup-screen" class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100">
            <h2 class="text-xl font-bold mb-6 text-slate-700 border-b pb-3">請選擇欲挑戰的測驗章節</h2>
            <div id="chapter-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- 由 JS 動態生成三章按鈕 -->
            </div>
        </div>

        <!-- 步驟二：測驗進行畫面 -->
        <div id="quiz-screen" class="hidden">
            <!-- 進度條 -->
            <div class="bg-white rounded-full h-2 w-full mb-4 overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
            </div>
            
            <div class="flex justify-between items-center mb-6">
                <span id="question-index" class="text-sm font-semibold text-slate-500">題目載入中...</span>
                <button onclick="confirmExit()" class="text-xs text-red-500 hover:underline">結束本次測驗</button>
            </div>

            <!-- 題目卡片 -->
            <div class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100 min-h-[300px] flex flex-col justify-between">
                <div class="space-y-4">
                    <!-- 試題來源標籤 -->
                    <div id="question-source" class="inline-block bg-blue-50 text-blue-700 border border-blue-100 text-xs font-semibold px-2.5 py-1 rounded-md"></div>
                    
                    <!-- 題目文字 -->
                    <div id="question-content" class="mb-4"></div>
                </div>

                <!-- 💡 提示顯示區域 -->
                <div id="hint-area" class="hidden my-4 transition-all duration-200">
                    <!-- 提示文字動態生成 -->
                </div>

                <!-- 答題區：選擇題 -->
                <div id="mcq-options" class="space-y-3 hidden my-4">
                    <!-- 4個選項按鈕 -->
                </div>

                <!-- 答題區：非選擇題 -->
                <div id="non-mcq-area" class="space-y-4 hidden my-4">
                    <label class="block text-sm font-medium text-slate-600">請在下方書寫您的解題過程與最終答案（供測驗後對照自評）：</label>
                    <textarea id="non-mcq-input" rows="6" class="w-full border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-sans" placeholder="例：設原本甲、乙、丙三組各有 x/3 人..."></textarea>
                </div>

                <!-- 下方動作按鈕列 -->
                <div class="mt-8 pt-4 border-t border-slate-100 flex justify-between items-center">
                    <!-- 提示按鈕 -->
                    <button id="hint-btn" onclick="toggleHint()" class="hidden text-amber-700 hover:text-amber-800 bg-amber-50 hover:bg-amber-100 border border-amber-200 font-semibold px-4 py-2 rounded-xl text-xs transition-all flex items-center gap-1.5 shadow-sm">
                        <span>💡</span> 顯示解題提示
                    </button>
                    <!-- 佔位符 -->
                    <span id="hint-placeholder" class="block w-1"></span>
                    
                    <!-- 下一步按鈕 -->
                    <button id="next-btn" onclick="handleNext()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-xl transition-all shadow-sm">
                        下一題
                    </button>
                </div>
            </div>
        </div>

        <!-- 步驟三：結算與非選自評畫面 -->
        <div id="result-screen" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100 text-center">
                <div class="inline-flex p-4 bg-emerald-50 rounded-full text-emerald-600 mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">測驗挑戰完成！</h2>
                <p class="text-slate-500 mt-2">選擇題答對率：<span id="score-text" class="text-blue-600 font-bold text-xl">0%</span></p>
                <p class="text-slate-400 text-xs mt-1">（請參考下方「錯題分析」與「非選擇題自評」重修不熟的觀念喔！）</p>
                <button onclick="initQuizSetup()" class="mt-6 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-6 py-2 rounded-xl transition-all">返回首頁選擇章節</button>
            </div>

            <!-- ❌ 選擇題錯題分析區 -->
            <div id="wrong-analysis-card" class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100 space-y-6 hidden">
                <h3 class="text-lg font-bold text-slate-800 border-b pb-3 flex items-center gap-2">
                    <span class="text-red-600">❌ 選擇題錯題分析與觀念重建</span>
                    <span class="text-xs font-normal text-slate-400">（特別針對答錯的題目進行解析與複習）</span>
                </h3>
                <div id="wrong-analysis-container" class="space-y-6">
                    <!-- 錯題分析對照動態生成 -->
                </div>
            </div>

            <!-- 📝 非選擇題自評區 -->
            <div id="non-mcq-card" class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100 space-y-8 hidden">
                <h3 class="text-lg font-bold text-slate-800 border-b pb-3 flex items-center gap-2">
                    <span>📝 非選擇題「算式對照」與自評</span>
                    <span class="text-xs font-normal text-slate-400">（請根據會考閱卷規範檢視自己的邏輯喔！）</span>
                </h3>
                <div id="self-eval-container" class="space-y-8 divide-y divide-slate-100">
                    <!-- 非選答案對照動態生成 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        /************************************************************
         * 【116 國中數學第一冊 CH1 ~ CH3 完整隨機題庫】
         * - 題庫規模極大化，支持完全隨機抽取 15 題選擇 ＋ 5 題非選。
         ************************************************************/
        const quizDatabase = {
    "ch1": {
        "title": "CH1 整數的運算與科學記號",
        "mcq": [
            {
                "q": "花店老闆每賣出一盆花，就會記錄這筆交易的賺賠情形。他以「＋」表示賺錢，以「－」表示賠錢。若賠了 190 元，應該怎麼記？",
                "opts": [
                    "＋10 元",
                    "＋190 元",
                    "－10 元",
                    "－190 元"
                ],
                "ans": 3,
                "source": "Best 試卷(基礎) 1-1 第 1 題",
                "hint": "根據題意，「＋」代表賺錢，「－」代表賠錢，因此賠 190 元需使用負號與數值表示。",
                "exp": "賺記為＋，賠記為－。故賠 190 元記為－190 元。選 D。"
            },
            {
                "q": "下列各數中，哪一個不是整數？",
                "opts": [
                    "0",
                    "－2",
                    "5",
                    "2.5"
                ],
                "ans": 3,
                "source": "Best 試卷(基礎) 1-1 第 2 題",
                "hint": "整數包含正整數、零與負整數。小數與分數不屬於整數。",
                "exp": "2.5 是小數，不是整數。其餘 0, -2, 5 均為整數。選 D。"
            },
            {
                "q": "數線上 A 點在 1 與 2 之間，將其分成十等分，A 點位於第七格小隔線上。則 A 點所代表的坐標為多少？",
                "opts": [
                    "1.6",
                    "1.7",
                    "1.8",
                    "1.9"
                ],
                "ans": 1,
                "source": "Best 試卷(基礎) 1-1 第 3 題",
                "hint": "數線上 1 與 2 之間均分十等分，每等分為 0.1，第七格即為 1 + 0.7 = 1.7。",
                "exp": "從 1 往右數 7 格，每一格代表 0.1。故坐標為 1.7。選 B。"
            },
            {
                "q": "有一個數不比 2 大，也不比 2 小，則該數為多少？",
                "opts": [
                    "0",
                    "2",
                    "－2",
                    "3"
                ],
                "ans": 1,
                "source": "Best 試卷(基礎) 1-1 第 4 題",
                "hint": "不比 2 大代表「小於或等於 2」；不比 2 小代表「大於或等於 2」。兩者同時成立即為該數本身。",
                "exp": "不比 2 大且不比 2 小，代表該數只能為 2。選 B。"
            },
            {
                "q": "下列數值中，哪一個不是絕對值小於 3 的整數？",
                "opts": [
                    "0",
                    "－1",
                    "2",
                    "－4"
                ],
                "ans": 3,
                "source": "Best 試卷(基礎) 1-1 第 5 題",
                "hint": "絕對值小於 3 的整數包括：-2, -1, 0, 1, 2。請檢查選項中哪個數字的絕對值大於或等於 3。",
                "exp": "｜－4｜＝ 4 ＞ 3，故 －4 不是絕對值小於 3 的整數。選 D。"
            },
            {
                "q": "已知 \\(c\\) 為負整數，且 \\(｜c｜＜6\\)，則 \\(c\\) 有幾種可能？",
                "opts": [
                    "3 種",
                    "4 種",
                    "5 種",
                    "6 種"
                ],
                "ans": 2,
                "source": "Best 試卷(基礎) 1-1 第 6 題",
                "hint": "滿足 \\(｜c｜＜6\\) 的負整數 \\(c\\) 包括：-1, -2, -3, -4, -5。數數看共有幾種可能。",
                "exp": "符合條件的負整數有 -1, -2, -3, -4, -5，共 5 種。選 C。"
            },
            {
                "q": "小兔子原本在數線上 (－4) 的位置，後來又往左邊走 6 個單位，則下列哪個選項可以表示這隻小兔子最後的位置？",
                "opts": [
                    "(－4)＋(－6)",
                    "(－4)＋6",
                    "4＋(－6)",
                    "4＋6"
                ],
                "ans": 0,
                "source": "Best 試卷(基礎) 1-2 第 1 題",
                "hint": "在數線上「往左走」代表減去或加上一個負數。從 -4 往左走 6 個單位，應如何列式？",
                "exp": "往左走 6 單位代表加上 －6。故最後位置表示為 (－4) ＋ (－6) ＝ －10。選 A。"
            },
            {
                "q": "下列哪一個算式的結果與其他三者不同？",
                "opts": [
                    "(－15)＋9",
                    "(－4)＋(－2)",
                    "(－3)＋3",
                    "1＋(－7)"
                ],
                "ans": 2,
                "source": "Best 試卷(基礎) 1-2 第 2 題",
                "hint": "各別算出四個選項的值：A是 -6, B是 -6, C是 0, D是 -6。比對結果。",
                "exp": "(A) -6, (B) -6, (C) 0, (D) -6。故(C)不同。選 C。"
            },
            {
                "q": "小康班上這次數學考試的全班平均為 80 分，若以這個平均分數為基準，小康的成績比平均分數高了 5 分，記為 ＋5 分，那麼小軒成績 68 分，可記為多少分？",
                "opts": [
                    "－8",
                    "－12",
                    "＋8",
                    "＋68"
                ],
                "ans": 1,
                "source": "Best 試卷(進階) 1-1 第 1 題",
                "hint": "以 80 分為基準。小軒考 68 分，比 80 分少幾分？少的分數用負號表示。",
                "exp": "基準為 80 分。小軒考 68 分，比 80 分少 12 分，故記為 －12。選 B。"
            },
            {
                "q": "在數線上，A、B、C、D、O五點，若 B 點坐標位於 1 與 2 之間，且將 1 到 2 均分成 5 等分，B 點在第 3 個等分點上，則 B 點坐標為多少？",
                "opts": [
                    "0.2",
                    "1.3",
                    "1又3/5",
                    "1又2/4"
                ],
                "ans": 2,
                "source": "Best 試卷(進階) 1-1 第 2 題",
                "hint": "從 1 往右走 3 個等分，每個等分為 1/5。坐標即為 1 ＋ 3/5 ＝ 1又3/5。",
                "exp": "B點坐標介於 1 與 2 之間，分成 5 等分第 3 格，故為 1又3/5。選 C。"
            },
            {
                "q": "利用等臂天平比較甲、乙、丙、丁四個物品，發現：甲 ＞ 丁，乙 ＞ 甲，乙 ＞ 丙，丁 ＞ 丙。則甲、乙、丙、丁四個物品中哪一個最輕？",
                "opts": [
                    "甲",
                    "乙",
                    "丙",
                    "丁"
                ],
                "ans": 2,
                "source": "Best 試卷(進階) 1-1 第 3 題",
                "hint": "由題意，甲 > 丁，乙 > 甲，丁 > 丙，可得大小關係為：乙 ＞ 甲 ＞ 丁 ＞ 丙。比比看誰在最末端？",
                "exp": "由條件：乙 ＞ 甲 ＞ 丁 ＞ 丙。因此最輕的是丙。選 C。"
            },
            {
                "q": "數線上 －5又2/7 和 3.8 之間共有多少個整數點？",
                "opts": [
                    "11 個",
                    "10 個",
                    "9 個",
                    "8 個"
                ],
                "ans": 1,
                "source": "Best 試卷(進階) 1-1 第 6 題",
                "hint": "找出大於 －5又2/7 且小於 3.8 的所有整數。即為 －5, －4, －3, －2, －1, 0, 1, 2, 3。數數看共有幾個？",
                "exp": "符合條件的整數有：－5、－4、－3、－2、－1、0、1、2、3，共 10 個。選 C。"
            },
            {
                "q": "若 (甲－5) 的相反數為 －8，則甲＝？",
                "opts": [
                    "－3",
                    "－8",
                    "8",
                    "13"
                ],
                "ans": 3,
                "source": "Best 試卷(進階) 1-1 第 7 題",
                "hint": "相反數是指正負號相反的數。因為 (甲－5) 的相反數是 －8，代表 (甲－5) 必須等於 8。一元一次方程式移項求甲。",
                "exp": "若 (甲－5) 的相反數為 －8，則甲－5 ＝ 8，解得甲 ＝ 13。選 D。"
            },
            {
                "q": "計算 \\(6^3 ＋ (－4)^3\\) 之值為何？",
                "opts": [
                    "6",
                    "8",
                    "152",
                    "280"
                ],
                "ans": 2,
                "source": "Best 試卷(進階) 1-4 第 1 題",
                "hint": "分別算出乘方：\\(6^3 ＝ 6 \\times 6 \\times 6 ＝ 216\\)，\\((－4)^3 ＝ (－4) \\times (－4) \\times (－4) ＝ －64\\)。再相加。",
                "exp": "原式 ＝ 216 ＋ (－64) ＝ 152。選 C。"
            },
            {
                "q": "計算 \\((－1)^{105} － (－1)^{106} ÷ (－1)^{107} \\times (－1)\\) 之值為何？",
                "opts": [
                    "－2",
                    "0",
                    "1",
                    "2"
                ],
                "ans": 0,
                "source": "Best 試卷(進階) 1-4 第 4 題",
                "hint": "注意負一的乘方：負數的奇數次方是 －1，偶數次方是 1。帶回原式先乘除後加減。",
                "exp": "原式 ＝ \\((－1) － 1 ÷ (－1) \\times (－1) ＝ －1 － (－1) \\times (－1) ＝ －1 － 1 ＝ －2\\)。選 A。"
            },
            {
                "q": "算式 \\((－8)＋(－2) \\times (－3)\\) 之值為何？",
                "opts": [
                    "－14",
                    "－2",
                    "18",
                    "30"
                ],
                "ans": 1,
                "source": "110 年會考第 2 題",
                "hint": "遵守「先乘除、後加減」！先計算後面 \\((－2) \\times (－3)\\) 得正值，再與前面的 \\(－8\\) 相加。",
                "exp": "原式 ＝ \\((－8) ＋ 6 ＝ －2\\)。選 B。"
            },
            {
                "q": "算式 \\((－2) \\times ｜－5｜ － ｜－3｜\\) 之值為何？",
                "opts": [
                    "13",
                    "7",
                    "－13",
                    "－7"

                "ans": 2,
                "source": "106 年會考第 5 題",

            },
            {
                "q": "計算 \\(17 － 2 \\times [9 － 3 \\times 3 \\times (－7)] ÷ 3\\) 之值為何？",
                "opts": [
                    "－31",
                    "0",
                    "17",
                    "101"
                ],
                "ans": 0,
                "source": "103 年特招第 7 題",
                "hint": "中括號內部的乘除優先。\\(3 \\times 3 \\times (－7) ＝ －63\\)，中括號內為 \\(9 － (－63) ＝ 72\\)。再做中括號外的乘除法。",

                    "－164",
                    "228",
                    "232"
                ],
                "ans": 2,

        // 隨機自陣列挑戰隨機 N 個元素 (Fisher-Yates Shuffle 演算法)
        function getRandomSubset(arr, n) {
            let shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, n);
        }

        // 開始測驗：組裝試卷 (真正隨機抽出 15選擇 + 5非選功能！)
        function startQuiz(chapterKey) {
            currentChapter = chapterKey;
            const chData = quizDatabase[chapterKey];
            
            // 隨機抽出 15 題選擇 (池子大於15，保證每次不同！)
            const selectedMcq = getRandomSubset(chData.mcq, Math.min(chData.mcq.length, 15)).map(q => ({ ...q, type: 'mcq' }));
            // 隨機抽出 5 題非選 (池子大於5，打亂順序且富含變化！)
            const selectedNonMcq = getRandomSubset(chData.nonMcq, Math.min(chData.nonMcq.length, 5)).map(q => ({ ...q, type: 'nonMcq' }));
            
            currentQuestions = [...selectedMcq, ...selectedNonMcq];
            currentQuestionIndex = 0;
            userMcqAnswers = [];
            userNonMcqAnswers = [];

            if(currentQuestions.length === 0) {
                alert("該章節目前沒有題目，請先於程式碼中加入題目。");
                return;
            }

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            showQuestion();
        }

            const progress = ((currentQuestionIndex) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            
            const totalMcq = currentQuestions.filter(x => x.type === 'mcq').length;
            const totalNon = currentQuestions.filter(x => x.type === 'nonMcq').length;

                ? `【選擇題】第 ${currentQuestionIndex + 1}/${totalMcq} 題` 
                : `【非選擇題】第 ${currentQuestionIndex + 1 - totalMcq}/${totalNon} 題`;
            document.getElementById('question-index').textContent = qTypeLabel;

            // 顯示試題來源
            const sourceDiv = document.getElementById('question-source');
            sourceDiv.textContent = `試題來源：${q.source || "116 會考模擬專用池"}`;

            // 填入題目內容
            const contentDiv = document.getElementById('question-content');
            contentDiv.innerHTML = `<h3 class="text-lg font-medium text-slate-800 leading-relaxed">${q.q}</h3>`;

            // 設定「顯示提示」按鈕
            if (q.hint) {
                const hintBtn = document.getElementById('hint-btn');
                const hintArea = document.getElementById('hint-area');
                
                hintBtn.classList.remove('hidden');

        function handleNext() {
            const q = currentQuestions[currentQuestionIndex];
            
            if (q.type === 'mcq') {
                const isCorrect = (selectedOptionIndex === q.ans);
                // 儲存詳細錯題分析物件
                userMcqAnswers.push({
                    q: q.q,
                    opts: q.opts,
                    userAns: selectedOptionIndex,
                    correctAns: q.ans,
                    isCorrect: isCorrect,
                    exp: q.exp,
                    source: q.source
                });
            } else {
                const inputVal = document.getElementById('non-mcq-input').value.trim();
                userNonMcqAnswers.push({
                    q: q.q,
                    source: q.source,
                    userAnswer: inputVal || "（未書寫過程，直接看解答對照）",
                    exp: q.exp,
                    rubric: q.rubric
                });
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

                                </div>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 text-xs text-slate-700 leading-relaxed">
                                <strong class="text-slate-900 block mb-1">💡 錯題觀念解析：</strong>
                                ${item.exp}
                            </div>
                        `;
                        wrongContainer.appendChild(card);
                    });
                }
            } else {
                wrongAnalysisCard.classList.add('hidden');
            }

            // 3. 渲染【📝 非選擇題自評】區塊
            const nonMcqCard = document.getElementById('non-mcq-card');
            const container = document.getElementById('self-eval-container');
            container.innerHTML = "";

            if (userNonMcqAnswers.length > 0) {
                nonMcqCard.classList.remove('hidden');
                userNonMcqAnswers.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = "pt-6 first:pt-0 space-y-4";
                    
                    let rubricHtml = "";
                    if (item.rubric) {
                        item.rubric.forEach(step => {
                            rubricHtml += `<li class="text-xs text-slate-600 list-disc ml-4 mt-1">${step}</li>`;
                        });
                    } else {
                        rubricHtml = `<li class="text-xs text-slate-400 list-none italic">本題未設定三點指標，請直接參考解析。</li>`;
                    }

                    card.innerHTML = `
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <div class="flex justify-between items-center mb-2">
                                <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded">非選第 ${index + 1} 題</span>
                                <span class="text-xs text-slate-400">來源：${item.source}</span>
                            </div>
                            <div class="text-sm font-medium text-slate-800 leading-relaxed">${item.q}</div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="border border-amber-100 bg-amber-50/20 p-4 rounded-xl">
                                <span class="text-xs font-bold text-amber-700">✍️ 您的解題紀錄：</span>
                                <pre class="text-xs text-slate-700 mt-2 whitespace-pre-wrap font-sans bg-white p-3 rounded border border-amber-100/50">${item.userAnswer}</pre>
                            </div>
                            <div class="border border-emerald-100 bg-emerald-50/20 p-4 rounded-xl font-sans">
                                <span class="text-xs font-bold text-emerald-700">💡 官方參考詳解與思維：</span>
                                <div class="text-xs text-slate-700 mt-2 bg-white p-3 rounded border border-emerald-100/50 leading-relaxed">${item.exp}</div>
                            </div>
                        </div>

                        <div class="border border-slate-200 p-4 rounded-xl bg-slate-100/30">
                            <span class="text-xs font-bold text-slate-500 flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
                                會考非選評分標準對照（三點評分指引）
                            </span>
                            <ul class="mt-2 space-y-1">
                                ${rubricHtml}
                            </ul>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                nonMcqCard.classList.add('hidden');
            }

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // 防呆離開提示
        function confirmExit() {
            if(confirm("確定要放棄本次測驗並返回首頁嗎？目前的答題進度將不會被儲存。")) {
                initQuizSetup();
            }
        }

        window.onload = initQuizSetup;
    </script>
</body>
</html>
