<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>116 國中數學第一冊（一至三章）會考模擬特訓網頁</title>
    <!-- 引入 Tailwind CSS 打造現代化美觀介面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 MathJax 讓數學公式、根號、指數、分數完美呈現 -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 頂部導覽列 -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md py-6 px-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">116 國中數學(一)會考非選與歷屆特訓</h1>
                <p class="text-blue-100 text-sm mt-1">分章自我檢測系統 • 每回隨機抽測：15 題選擇 ＋ 5 題非選</p>
            </div>
            <span class="bg-white/20 text-white px-3 py-1 rounded-full text-xs font-semibold">116 專用錯題自評版</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto my-8 px-4">
        <!-- 步驟一：選擇章節畫面 -->
        <div id="setup-screen" class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100">
            <h2 class="text-xl font-bold mb-6 text-slate-700 border-b pb-3">請選擇欲挑戰的測驗章節</h2>
            <div id="chapter-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- 由 JS 動態生成三章按鈕 -->
            </div>
        </div>

        <!-- 步驟二：測驗進行畫面 -->
        <div id="quiz-screen" class="hidden">
            <!-- 進度條 -->
            <div class="bg-white rounded-full h-2 w-full mb-4 overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
            </div>
            
            <div class="flex justify-between items-center mb-6">
                <span id="question-index" class="text-sm font-semibold text-slate-500">題目載入中...</span>
                <button onclick="confirmExit()" class="text-xs text-red-500 hover:underline">結束本次測驗</button>
            </div>

            <!-- 題目卡片 -->
            <div class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100 min-h-[300px] flex flex-col justify-between">
                <div class="space-y-4">
                    <!-- 試題來源標籤 -->
                    <div id="question-source" class="inline-block bg-blue-50 text-blue-700 border border-blue-100 text-xs font-semibold px-2.5 py-1 rounded-md"></div>
                    
                    <!-- 題目文字 -->
                    <div id="question-content" class="mb-4"></div>
                </div>

                <!-- 💡 提示顯示區域 -->
                <div id="hint-area" class="hidden my-4 transition-all duration-200">
                    <!-- 提示文字動態生成 -->
                </div>

                <!-- 答題區：選擇題 -->
                <div id="mcq-options" class="space-y-3 hidden my-4">
                    <!-- 4個選項按鈕 -->
                </div>

                <!-- 答題區：非選擇題 -->
                <div id="non-mcq-area" class="space-y-4 hidden my-4">
                    <label class="block text-sm font-medium text-slate-600">請在下方書寫您的解題過程與最終答案（供測驗後對照自評）：</label>
                    <textarea id="non-mcq-input" rows="6" class="w-full border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-sans" placeholder="例：設原本甲、乙、丙三組各有 x/3 人..."></textarea>
                </div>

                <!-- 下方動作按鈕列 -->
                <div class="mt-8 pt-4 border-t border-slate-100 flex justify-between items-center">
                    <!-- 提示按鈕 -->
                    <button id="hint-btn" onclick="toggleHint()" class="hidden text-amber-700 hover:text-amber-800 bg-amber-50 hover:bg-amber-100 border border-amber-200 font-semibold px-4 py-2 rounded-xl text-xs transition-all flex items-center gap-1.5 shadow-sm">
                        <span>💡</span> 顯示解題提示
                    </button>
                    <!-- 佔位符 -->
                    <span id="hint-placeholder" class="block w-1"></span>
                    
                    <!-- 下一步按鈕 -->
                    <button id="next-btn" onclick="handleNext()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-xl transition-all shadow-sm">
                        下一題
                    </button>
                </div>
            </div>
        </div>

        <!-- 步驟三：結算與非選自評畫面 -->
        <div id="result-screen" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100 text-center">
                <div class="inline-flex p-4 bg-emerald-50 rounded-full text-emerald-600 mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">測驗挑戰完成！</h2>
                <p class="text-slate-500 mt-2">選擇題答對率：<span id="score-text" class="text-blue-600 font-bold text-xl">0%</span></p>
                <p class="text-slate-400 text-xs mt-1">（請參考下方「錯題分析」與「非選擇題自評」重修不熟的觀念喔！）</p>
                <button onclick="initQuizSetup()" class="mt-6 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-6 py-2 rounded-xl transition-all">返回首頁選擇章節</button>
            </div>

            <!-- ❌ 選擇題錯題分析區 -->
            <div id="wrong-analysis-card" class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100 space-y-6 hidden">
                <h3 class="text-lg font-bold text-slate-800 border-b pb-3 flex items-center gap-2">
                    <span class="text-red-600">❌ 選擇題錯題分析與觀念重建</span>
                    <span class="text-xs font-normal text-slate-400">（特別針對答錯的題目進行解析與複習）</span>
                </h3>
                <div id="wrong-analysis-container" class="space-y-6">
                    <!-- 錯題分析對照動態生成 -->
                </div>
            </div>

            <!-- 📝 非選擇題自評區 -->
            <div id="non-mcq-card" class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100 space-y-8 hidden">
                <h3 class="text-lg font-bold text-slate-800 border-b pb-3 flex items-center gap-2">
                    <span>📝 非選擇題「算式對照」與自評</span>
                    <span class="text-xs font-normal text-slate-400">（請根據會考閱卷規範檢視自己的邏輯喔！）</span>
                </h3>
                <div id="self-eval-container" class="space-y-8 divide-y divide-slate-100">
                    <!-- 非選答案對照動態生成 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        /************************************************************

                        "source": "會考非選模擬篇 CH1 第 2 題",

                ]
            },
            "ch3": {
                "title": "CH3 一元一次方程式與應用問題",
                "mcq": [
                    { 
                        "q": "某日服飾店大拍賣，外套打六折出售，襯衫和褲子打八折出售。已知外套原價 250 元，襯衫原價 125 元，褲子原價 125 元。服飾共賣出 200 件，共得 24000 元。若外套賣出 \\(x\\) 件，則依題意可列出下列哪一個一元一次方程式？",

                        "exp": "兩邊同乘以 3：\\(6x － (9 － x) ＝ 33\\) ⇒ \\(6x － 9 ＋ x ＝ 33\\) ⇒ \\(7x ＝ 42\\) ⇒ \\(x ＝ 6\\)。選 A。" 
                    },
                    { 
                        "q": "已知麵包店的麵包一個 15 元。結帳時店員告訴小明：「如果你再多買一個麵包就可以打九折，價錢會比現在便宜 45 元」。根據對話，小明原本想買多少個麵包？", 
                        "opts": ["38", "39", "40", "41"],

                        "hint": "設原本買 x 個。原本需付 \\(15x\\) 元；多買一個 (x+1 個) 打九折需付 \\(15(x+1) \times 0.9\\) 元。後者比前者少 45 元。",
                        "exp": "設原欲買 x 個，依題意列式：\\(15x － 15(x＋1)×0.9 ＝ 45\\) ⇒ \\(1.5x － 13.5 ＝ 45\\) ⇒ \\(1.5x ＝ 58.5\\) ⇒ \\(x ＝ 39\\)（個）。選 B。"

                ],
                "nonMcq": [
                    {
                        "q": "如圖，有大、小兩個長方形，其重疊部分的面積占大長方形面積的 \\(\\frac{1}{8}\\)，且占小長方形面積的 \\(\\frac{3}{5}\\)，未重疊部分（扣除鋪色面積）的總面積為 115，試求小長方形的面積為多少？",
                        "source": "會考非選模擬篇 CH3 第 1 題",
                        "hint": "設小長方形面積為 x。則重疊部分面積可記為 \\(\\frac{3}{5}x\\)。進而求出大長方形面積。將大、小長方形各自扣除重疊面積加總等於 115 列式求解。",
                        "exp": "設小長方形為 x，重疊為 \\(\\frac{3}{5}x\\)。大長方形為 \\(\\frac{3}{5}x \times 8 = \\frac{24}{5}x\\)。<br>未重疊面積之和：\\(\\frac{24}{5}x \times \\frac{7}{8} + x \times \\frac{2}{5} = 115\\) ⇒ \\(\\frac{21}{5}x + \\frac{2}{5}x = 115\\) ⇒ \\(\\frac{23}{5}x = 115\\) ⇒ \\(x = 25\\)。",
                        "rubric": [
                            "3 分：解題策略適切，列式與求解過程合理完整，答案 25 正確無誤。",
                            "2 分：能正確列出一元一次方程式，但在去分母或移項化簡時出現計算錯誤。",
                            "1 分：未能列出正確方程式，但能藉由重疊比例正確表達大、小長方形面積的關係。",
                            "0 分：空白或僅寫答案無算式。"
                        ]
                    },
                    {
                        "q": "王老師將班上的學生等分成甲、乙、丙三組，後來又將甲組人數的 \\(\\frac{1}{4}\\) 移到乙組，並將乙組中的 4 人移到丙組，最後丙組的總人數比乙組的 2 倍少 6 人。若全班共有 x 位學生，請列出方程式，並求出 x 之值。",
                        "source": "會考非選模擬篇 CH3 第 3 題",
                        "hint": "一開始每組有 \\(\\frac{x}{3}\\) 人。一步步寫出變動後各組的人數表示式，再依據最後乙、丙組的數量關係列出方程式。",
                        "exp": "原每組 \\(\\frac{x}{3}\\) 人。變動後：<br>甲組：\\(\\frac{x}{3} \times \\frac{3}{4} = \frac{x}{4}\\) 人。<br>乙組：\\(\\frac{x}{3} + \\frac{x}{12} - 4 = \\frac{5}{12}x - 4\\) 人。<br>丙組：\\(\\frac{x}{3} + 4\\) 人。<br>依題意：\\(\\frac{x}{3} + 4 = 2(\\frac{5}{12}x - 4) - 6\\) ⇒ \\(\\frac{x}{3} + 4 = \\frac{5}{6}x - 14\\) ⇒ \\(6x = 216\\) ⇒ \\(x = 36\\) 人。",
                        "rubric": [
                            "3 分：方程式列式正確、求解步驟完整且答案 36 正確。",
                            "2 分：能依題意列出正確的方程式，但求解過程中出現計算筆誤。",
                            "1 分：未注意到全班為 x 人的假設，或能列出各組的人數代數式但方程式錯誤。",
                            "0 分：空白或與題目完全無關。"

                    }
                ]
            }
        };

        // 全域變數
        let currentChapter = "";
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let userMcqAnswers = []; // 儲存選擇題的答題細節對象
        let userNonMcqAnswers = []; // 儲存非選題學生的文字回答

        // 初始化：渲染章節選擇
        function initQuizSetup() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            
            const listDiv = document.getElementById('chapter-list');
            listDiv.innerHTML = "";
            
            for (let chKey in quizDatabase) {
                const ch = quizDatabase[chKey];
                const btn = document.createElement('button');
                btn.className = "p-6 border border-slate-200 bg-white rounded-2xl text-left hover:border-blue-500 hover:bg-blue-50/30 transition-all group flex flex-col justify-between shadow-sm hover:shadow-md h-full";
                btn.onclick = () => startQuiz(chKey);
                btn.innerHTML = `
                    <div class="mb-4">
                        <h3 class="font-bold text-slate-800 text-lg group-hover:text-blue-600 transition-colors">${ch.title}</h3>
                        <p class="text-xs text-slate-400 mt-2 leading-relaxed">內含歷屆基測、會考與非選模擬精選，提供解題思路提示與錯題概念重建。</p>
                    </div>
                    <div class="w-full flex justify-between items-center pt-3 border-t border-slate-100">
                        <span class="text-xs font-semibold text-slate-500">題庫：${ch.mcq.length} 選擇 / ${ch.nonMcq.length} 非選</span>
                        <span class="text-blue-600 font-bold text-sm group-hover:translate-x-1 transition-transform">挑戰 →</span>
                    </div>
                `;
                listDiv.appendChild(btn);
            }
        }

        // 隨機自陣列抽選 N 個元素
        function getRandomSubset(arr, n) {
            let shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, n);
        }

        // 開始測驗：組裝試卷 (隨機抽取 15選擇 + 5非選，若題庫不夠則全抽)
        function startQuiz(chapterKey) {
            currentChapter = chapterKey;
            const chData = quizDatabase[chapterKey];
            
            const selectedMcq = getRandomSubset(chData.mcq, 15).map(q => ({ ...q, type: 'mcq' }));
            const selectedNonMcq = getRandomSubset(chData.nonMcq, 5).map(q => ({ ...q, type: 'nonMcq' }));
            
            currentQuestions = [...selectedMcq, ...selectedNonMcq];
            currentQuestionIndex = 0;
            userMcqAnswers = [];
            userNonMcqAnswers = [];

            if(currentQuestions.length === 0) {
                alert("該章節目前沒有題目，請先於程式碼中加入題目。");
                return;
            }

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            showQuestion();
        }

        // 顯示當前題目
        function showQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            
            // 重置提示與顯示狀態
            document.getElementById('hint-area').classList.add('hidden');
            document.getElementById('hint-btn').classList.add('hidden');
            document.getElementById('hint-placeholder').classList.remove('hidden');

            // 更新進度條與題號
            const progress = ((currentQuestionIndex) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            
            const totalMcq = currentQuestions.filter(x => x.type === 'mcq').length;
            const totalNon = currentQuestions.filter(x => x.type === 'nonMcq').length;
            const qTypeLabel = q.type === 'mcq' 
                ? `【選擇題】第 ${currentQuestionIndex + 1}/${totalMcq} 題` 
                : `【非選擇題】第 ${currentQuestionIndex + 1 - totalMcq}/${totalNon} 題`;
            document.getElementById('question-index').textContent = qTypeLabel;

            // 顯示試題來源
            const sourceDiv = document.getElementById('question-source');
            sourceDiv.textContent = `試題來源：${q.source || "116會考非選特訓模擬庫"}`;

            // 填入題目內容
            const contentDiv = document.getElementById('question-content');
            contentDiv.innerHTML = `<h3 class="text-lg font-medium text-slate-800 leading-relaxed">${q.q}</h3>`;

            // 設定「顯示提示」按鈕
            if (q.hint) {
                const hintBtn = document.getElementById('hint-btn');
                const hintArea = document.getElementById('hint-area');
                
                hintBtn.classList.remove('hidden');
                document.getElementById('hint-placeholder').classList.add('hidden');

                hintArea.innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl text-xs leading-relaxed flex items-start gap-2.5">
                        <span class="text-base mt-0.5">💡</span>
                        <div>
                            <strong class="block mb-1 text-amber-900">思維導引提示：</strong>
                            <span>${q.hint}</span>
                        </div>
                    </div>
                `;
            }

            // 切換選擇題或非選擇題之答題面板
            const mcqDiv = document.getElementById('mcq-options');
            const nonMcqDiv = document.getElementById('non-mcq-area');
            
            if (q.type === 'mcq') {
                mcqDiv.classList.remove('hidden');
                nonMcqDiv.classList.add('hidden');
                
                // 動態產生 4 個選項
                mcqDiv.innerHTML = "";
                q.opts.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-4 border border-slate-200 rounded-xl hover:bg-slate-50 hover:border-slate-300 bg-white transition-all flex items-center gap-3";
                    btn.onclick = () => selectMcqOption(index, btn);
                    btn.innerHTML = `
                        <span class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500">${String.fromCharCode(65 + index)}</span>
                        <span>${opt}</span>
                    `;
                    mcqDiv.appendChild(btn);
                });
                
                document.getElementById('next-btn').disabled = true; // 選擇後才能按下一步
                document.getElementById('next-btn').classList.add('opacity-50');
            } else {
                mcqDiv.classList.add('hidden');
                nonMcqDiv.classList.remove('hidden');
                
                // 清空非選輸入框
                document.getElementById('non-mcq-input').value = "";
                document.getElementById('next-btn').disabled = false;
                document.getElementById('next-btn').classList.remove('opacity-50');
            }

            // 排版渲染數學符號
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // 開關提示視窗
        function toggleHint() {
            const hintArea = document.getElementById('hint-area');
            hintArea.classList.toggle('hidden');
        }

        // 選擇選擇題選項
        let selectedOptionIndex = null;
        function selectMcqOption(index, element) {
            selectedOptionIndex = index;
            
            const buttons = document.getElementById('mcq-options').querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('border-blue-500', 'bg-blue-50/50');
                btn.querySelector('span').classList.remove('bg-blue-600', 'text-white');
                btn.querySelector('span').classList.add('bg-slate-100', 'text-slate-500');
            });

            element.classList.add('border-blue-500', 'bg-blue-50/50');
            element.querySelector('span').classList.remove('bg-slate-100', 'text-slate-500');
            element.querySelector('span').classList.add('bg-blue-600', 'text-white');

            document.getElementById('next-btn').disabled = false;
            document.getElementById('next-btn').classList.remove('opacity-50');
        }

        // 處理「下一題」
        function handleNext() {
            const q = currentQuestions[currentQuestionIndex];
            
            if (q.type === 'mcq') {
                const isCorrect = (selectedOptionIndex === q.ans);
                // 儲存詳細錯題分析物件
                userMcqAnswers.push({
                    q: q.q,
                    opts: q.opts,
                    userAns: selectedOptionIndex,
                    correctAns: q.ans,
                    isCorrect: isCorrect,
                    exp: q.exp,
                    source: q.source
                });
            } else {
                const inputVal = document.getElementById('non-mcq-input').value.trim();
                userNonMcqAnswers.push({
                    q: q.q,
                    source: q.source,
                    userAnswer: inputVal || "（未書寫過程，直接看解答對照）",
                    exp: q.exp,
                    rubric: q.rubric
                });
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        // 顯示成績、選擇題錯題分析與非選題自評對照
        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            // 1. 計算選擇題得分
            const correctCount = userMcqAnswers.filter(x => x.isCorrect === true).length;
            const totalMcq = userMcqAnswers.length;
            const scorePercentage = totalMcq > 0 ? Math.round((correctCount / totalMcq) * 100) : 0;
            document.getElementById('score-text').textContent = `${scorePercentage}% (共答對 ${correctCount}/${totalMcq} 題)`;

            // 2. 渲染【❌ 選擇題錯題分析】區塊
            const wrongAnalysisCard = document.getElementById('wrong-analysis-card');
            const wrongContainer = document.getElementById('wrong-analysis-container');
            wrongContainer.innerHTML = "";

            if (totalMcq > 0) {
                wrongAnalysisCard.classList.remove('hidden');
                const wrongQuestions = userMcqAnswers.filter(x => !x.isCorrect);
                
                if (wrongQuestions.length === 0) {
                    wrongContainer.innerHTML = `
                        <div class="text-center py-8 px-4 text-emerald-700 font-semibold bg-emerald-50 rounded-2xl border border-emerald-100 flex flex-col items-center justify-center gap-2">
                            <span class="text-3xl">🎉</span>
                            <div>太強了！您在此章節的所有選擇題中拿到滿分，沒有任何錯題！</div>
                            <span class="text-xs font-normal text-slate-400 leading-relaxed">100% 答對率，概念無懈可擊，繼續保持！</span>
                        </div>
                    `;
                } else {
                    wrongQuestions.forEach((item, index) => {
                        const card = document.createElement('div');
                        card.className = "p-5 border border-red-100 bg-red-50/10 rounded-2xl space-y-3";
                        card.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span class="bg-red-100 text-red-700 text-xs font-bold px-2.5 py-1 rounded-md">第 ${index + 1} 題 錯題檢修</span>
                                <span class="text-xs text-slate-400">來源：${item.source}</span>
                            </div>
                            <div class="text-sm font-medium text-slate-800 leading-relaxed">${item.q}</div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs pt-1">
                                <div class="p-3 rounded-xl bg-red-50 border border-red-100/50 text-red-800 flex items-start gap-1.5">
                                    <span class="text-base leading-none">❌</span>
                                    <div>
                                        <strong>您的答案：</strong>(${String.fromCharCode(65 + item.userAns)}) ${item.opts[item.userAns]}
                                    </div>
                                </div>
                                <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-100/50 text-emerald-800 flex items-start gap-1.5">
                                    <span class="text-base leading-none">✅</span>
                                    <div>
                                        <strong>正確答案：</strong>(${String.fromCharCode(65 + item.correctAns)}) ${item.opts[item.correctAns]}
                                    </div>
                                </div>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 text-xs text-slate-700 leading-relaxed">
                                <strong class="text-slate-900 block mb-1">💡 錯題觀念解析：</strong>
                                ${item.exp}
                            </div>
                        `;
                        wrongContainer.appendChild(card);
                    });
                }
            } else {
                wrongAnalysisCard.classList.add('hidden');
            }

            // 3. 渲染【📝 非選擇題自評】區塊
            const nonMcqCard = document.getElementById('non-mcq-card');
            const container = document.getElementById('self-eval-container');
            container.innerHTML = "";

            if (userNonMcqAnswers.length > 0) {
                nonMcqCard.classList.remove('hidden');
                userNonMcqAnswers.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = "pt-6 first:pt-0 space-y-4";
                    
                    let rubricHtml = "";
                    if (item.rubric) {
                        item.rubric.forEach(step => {
                            rubricHtml += `<li class="text-xs text-slate-600 list-disc ml-4 mt-1">${step}</li>`;
                        });
                    } else {
                        rubricHtml = `<li class="text-xs text-slate-400 list-none italic">本題未設定三點指標，請直接參考解析。</li>`;
                    }

                    card.innerHTML = `
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <div class="flex justify-between items-center mb-2">
                                <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded">非選第 ${index + 1} 題</span>
                                <span class="text-xs text-slate-400">來源：${item.source}</span>
                            </div>
                            <div class="text-sm font-medium text-slate-800 leading-relaxed">${item.q}</div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="border border-amber-100 bg-amber-50/20 p-4 rounded-xl">
                                <span class="text-xs font-bold text-amber-700">✍️ 您的解題紀錄：</span>
                                <pre class="text-xs text-slate-700 mt-2 whitespace-pre-wrap font-sans bg-white p-3 rounded border border-amber-100/50">${item.userAnswer}</pre>
                            </div>
                            <div class="border border-emerald-100 bg-emerald-50/20 p-4 rounded-xl font-sans">
                                <span class="text-xs font-bold text-emerald-700">💡 官方參考詳解與思維：</span>
                                <div class="text-xs text-slate-700 mt-2 bg-white p-3 rounded border border-emerald-100/50 leading-relaxed">${item.exp}</div>
                            </div>
                        </div>

                        <div class="border border-slate-200 p-4 rounded-xl bg-slate-100/30">
                            <span class="text-xs font-bold text-slate-500 flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
                                會考非選評分標準對照（三點評分指引）
                            </span>
                            <ul class="mt-2 space-y-1">
                                ${rubricHtml}
                            </ul>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                nonMcqCard.classList.add('hidden');
            }

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // 防呆離開提示
        function confirmExit() {
            if(confirm("確定要放棄本次測驗並返回首頁嗎？目前的答題進度將不會被儲存。")) {
                initQuizSetup();
            }
        }

        window.onload = initQuizSetup;
    </script>
</body>
</html>
